services:
  auto-claude-code-rust-react:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-claude-code-rust-react:latest
    container_name: auto-claude-code-rust-react
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-18000}:${SERVER_PORT:-18000}"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      SERVER_HOST: "${SERVER_HOST:-0.0.0.0}"
      SERVER_PORT: "${SERVER_PORT:-18000}"
      MODEL_ID: "${MODEL_ID:-}"
      AGENT_MODEL_ID: "${AGENT_MODEL_ID:-}"
      AGENT_BASE_URL: "${AGENT_BASE_URL:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      AGENT_API_KEY: "${AGENT_API_KEY:-}"
      AGENT_MAX_TOKENS: "${AGENT_MAX_TOKENS:-}"
      AGENT_TEMPERATURE: "${AGENT_TEMPERATURE:-}"
      AGENT_TOP_P: "${AGENT_TOP_P:-}"
      MCP_BASE_URL: "${MCP_BASE_URL:-}"
      MCP_TIMEOUT: "${MCP_TIMEOUT:-}"
      MCP_CONNECT_TIMEOUT: "${MCP_CONNECT_TIMEOUT:-}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
      CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS:-false}"
      CORS_ALLOW_METHODS: "${CORS_ALLOW_METHODS:-*}"
      CORS_ALLOW_HEADERS: "${CORS_ALLOW_HEADERS:-*}"
    volumes:
      - ./config:/app/config:ro
      - ./skills:/app/skills
      - ./.user_memories:/app/.user_memories
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./.tasks:/app/.tasks
      - ./.worktrees:/app/.worktrees
      - ./.sessions:/app/.sessions
      - ./.transcripts:/app/.transcripts
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:${SERVER_PORT:-18000}/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
